# Ambiente de desenvolvimento: docker compose up

services:
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      # Mantém o node_modules instalado dentro do container (não usa o da máquina)
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Porta 5433 na máquina para não conflitar com um PostgreSQL local
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
